<div class="container background">
    @if (isLoading()) {
            <p>Loading...</p>
    } @else {
        <div class="tableContainer">
            <table class="assets-table">
                <thead>
                <tr>
                    <th>Asset</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Percentage</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                    @for (asset of assets(); track asset.symbol) {
                        <tr>
                            <td>{{ asset.symbol }}</td>
                            <td>{{ asset.quantity | number:'1.2-8' }}</td>
                            <td>{{ asset.price | currency:'EUR' }}</td>
                            <td>{{ asset.percentage }}%</td>
                            <td>
                                <button mat-icon-button class="btn primary" (click)="modifyAsset(asset.symbol)" title="Modify asset"><mat-icon>edit</mat-icon></button>
                                <button mat-icon-button class="btn secondary" (click)="removeAsset(asset.symbol)" title="Remove asset"><mat-icon>delete</mat-icon></button>
                            </td>
                        </tr>
                    } @empty {
                        <tr>
                            <td colspan="5">There are no assets</td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    }
</div>
