<div class="container background">
    <div class="elements">
        <form [formGroup]="assetForm" (ngSubmit)="addAsset()">
            <mat-form-field>
                <mat-label>Asset</mat-label>
                <mat-select formControlName="symbol" required>
                    <mat-option *ngFor="let symbol of symbols" [value]="symbol">
                        {{ symbol }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Quantity</mat-label>
                <input matInput type="number" formControlName="quantity" step="0.00001" placeholder="0.0001" required>
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit" [disabled]="assetForm.invalid">
                Add Asset
            </button>
        </form>
    </div>

    <div class="elements">
        <app-chart
            [datas]="chartData"
            [cryptoSymbol]="''">
        </app-chart>
    </div>

    <div class="elements">
        <h3>Assets</h3>

        <table class="assets-table" *ngIf="wallet.items.length > 0; else noAssets">
            <thead>
            <tr>
                <th>Asset</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Percentage</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr *ngFor="let asset of wallet.items; trackBy: trackBySymbol">
                <td><strong>{{ asset.symbol }}</strong></td>
                <td>{{ asset.quantity | number:'1.2-8' }}</td>
                <td>{{ asset.price | currency:'EUR':'symbol' }}</td>
                <td>
                        <span class="percentage">
                            {{ asset.percentage }}%
                        </span>
                </td>
                <td>
                    <button mat-icon-button class="btn secondary" (click)="removeAsset(asset.symbol)" title="Remove asset"><mat-icon>delete</mat-icon></button>
                </td>
            </tr>
            </tbody>
        </table>

        <ng-template #noAssets>
            <div class="no-assets">
                <p>No assets in the wallet.</p>
            </div>
        </ng-template>
    </div>

    <div class="backtest-section">
        <button
            mat-raised-button
            color="accent"
            class="backtest-button"
            [disabled]="wallet.items.length === 0"
            (click)="saveWallet()"
        >
            <span>🚀 Run Backtest</span>
        </button>
    </div>
</div>
