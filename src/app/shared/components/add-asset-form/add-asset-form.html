<form [formGroup]="assetForm" (ngSubmit)="onSubmit()">
  <mat-form-field>
    <mat-label>AssetModel</mat-label>
    <mat-select formControlName="symbol" required>
      @for (symbol of symbols; track symbol) {
        <mat-option [value]="symbol">
          {{ symbol }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Quantity</mat-label>
    <input matInput type="number" formControlName="amount" step="0.00001" placeholder="0.0001" required>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="assetForm.invalid">
    Add AssetModel
  </button>
</form>
